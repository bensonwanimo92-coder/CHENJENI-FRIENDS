<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Legend — Combat Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101315;color:#eee;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#293744 0%,#53606a 45%,#262b2e 46%,#15191b 100%)}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.panel{background:#101719cc;border:1px solid #87938a;border-radius:12px;padding:10px 14px;min-width:40%}.bar{height:12px;background:#42494a;border-radius:9px;margin-top:6px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b43b32,#e7a34c);width:100%;transition:width .2s}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;align-items:end}.pad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:5px}.btn{border:1px solid #a4a9a4;border-radius:14px;background:#17201ed9;color:white;font-weight:bold;font-size:18px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:grid;grid-template-columns:64px 64px;gap:7px}.actions button{height:70px;border-radius:50%;background:#803e34e8;font-size:13px}.actions .kick{background:#9c7431e8}.note{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);font-size:12px;color:#e6e2ce;background:#171d1bcc;padding:8px;border-radius:8px;white-space:nowrap}.title{position:fixed;top:90px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:0 3px 8px #000}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="panel"><b>PLAYER</b><div class="bar"><div id="hp" class="fill"></div></div><small id="hptext">100 / 100</small></div><div class="panel"><b>RIVAL</b><div class="bar"><div id="ehp" class="fill"></div></div><small id="ehptext">100 / 100</small></div></div><div class="title" id="title">STREET LEGEND · DEMO</div><div class="controls"><div class="pad"><button class="btn up" data-m="up">▲</button><button class="btn left" data-m="left">◀</button><button class="btn down" data-m="down">▼</button><button class="btn right" data-m="right">▶</button></div><div class="actions"><button class="btn" id="punch">PUNCH</button><button class="btn kick" id="kick">KICK</button><button class="btn" id="block" style="background:#385b4b">BLOCK</button><button class="btn" id="dodge" style="background:#375b7c">DODGE</button></div></div><div class="note">Combo: punch twice, kick · Block reduces damage · Dodge</div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();onresize=resize;
let player={x:0.36,y:0.65,hp:100,attack:0},enemy={x:0.64,y:0.58,hp:100,attack:0},keys={},flash=0,won=false;
function fighter(x,y,color,attack){let px=x*innerWidth,py=y*innerHeight,s=70+(y-.5)*55;ctx.save();ctx.translate(px,py);if(attack)ctx.rotate(attack*.12);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,s*.62,s*.38,s*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(-s*.18,-s*.1,s*.36,s*.48);ctx.fillStyle='#d3a078';ctx.beginPath();ctx.arc(0,-s*.3,s*.16,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=s*.13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*.12,s*.02);ctx.lineTo(-s*.4,s*.1+attack*4);ctx.moveTo(s*.12,s*.02);ctx.lineTo(s*.4,s*.08-attack*4);ctx.moveTo(-s*.08,s*.36);ctx.lineTo(-s*.24,s*.6);ctx.moveTo(s*.08,s*.36);ctx.lineTo(s*.22,s*.6);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let ground=innerHeight*.58;ctx.fillStyle='#293033';ctx.fillRect(0,ground,innerWidth,innerHeight-ground);for(let i=0;i<12;i++){ctx.strokeStyle='#343b3e';ctx.beginPath();ctx.moveTo(i*innerWidth/12,ground);ctx.lineTo(i*innerWidth/12,innerHeight);ctx.stroke()}fighter(player.x,player.y,'#315b83',player.attack);fighter(enemy.x,enemy.y,'#963d37',enemy.attack);if(flash){ctx.fillStyle='#fff4';ctx.fillRect(0,0,innerWidth,innerHeight);flash--}requestAnimationFrame(draw)}draw();
function update(){let sp=.005;for(let k in keys)if(keys[k]){if(k==='up')player.y-=sp;if(k==='down')player.y+=sp;if(k==='left')player.x-=sp;if(k==='right')player.x+=sp}player.x=Math.max(.1,Math.min(.9,player.x));player.y=Math.max(.45,Math.min(.85,player.y));if(enemy.hp>0){let dx=player.x-enemy.x,dy=player.y-enemy.y;enemy.x+=Math.sign(dx)*.0014;enemy.y+=Math.sign(dy)*.0008;if(Math.abs(dx)<.1&&Math.abs(dy)<.1&&Math.random()<.008){player.hp=Math.max(0,player.hp-4);flash=4;hud()}}hud();setTimeout(update,30)};
function hud(){document.querySelector('#hp').style.width=player.hp+'%';document.querySelector('#ehp').style.width=enemy.hp+'%';document.querySelector('#hptext').textContent=player.hp+' / 100';document.querySelector('#ehptext').textContent=enemy.hp+' / 100';if(enemy.hp<=0&&!won){won=true;document.querySelector('#title').textContent='VICTORY! · RIVAL DEFEATED';}if(player.hp<=0)document.querySelector('#title').textContent='DEFEATED · TAP TO RESTART'}
document.querySelectorAll('[data-m]').forEach(b=>{let m=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();keys[m]=true};b.onpointerup=b.onpointerleave=()=>keys[m]=false});
function hit(type){if(won||player.hp<=0)return;let dx=player.x-enemy.x,dy=player.y-enemy.y;if(Math.abs(dx)<.16&&Math.abs(dy)<.13){enemy.hp=Math.max(0,enemy.hp-(type==='kick'?16:10));enemy.attack=-1;flash=3;setTimeout(()=>enemy.attack=0,180)}player.attack=type==='kick'?2:1;setTimeout(()=>player.attack=0,200);hud()}
document.querySelector('#punch').onclick=()=>hit('punch');document.querySelector('#kick').onclick=()=>hit('kick');document.querySelector('#title').onclick=()=>{if(player.hp<=0||won){player.hp=enemy.hp=100;won=false;document.querySelector('#title').textContent='STREET LEGEND · DEMO';hud()}};

// Combat expansion: defensive actions, combos, and clearer enemy pressure.
let blocking=false, dodging=false, comboCount=0, comboTimer=null;
const blockBtn=document.querySelector('#block'),dodgeBtn=document.querySelector('#dodge');
blockBtn.onpointerdown=e=>{e.preventDefault();blocking=true;blockBtn.style.filter='brightness(1.5)'};
blockBtn.onpointerup=blockBtn.onpointerleave=()=>{blocking=false;blockBtn.style.filter=''};
dodgeBtn.onclick=()=>{if(won||player.hp<=0)return;dodging=true;player.x=Math.max(.08,Math.min(.92,player.x+(player.x<enemy.x?-0.07:0.07)));setTimeout(()=>dodging=false,380)};
const baseHit=hit;
hit=function(type){if(won||player.hp<=0)return;let dx=player.x-enemy.x,dy=player.y-enemy.y;if(Math.abs(dx)<.17&&Math.abs(dy)<.15){comboCount++;clearTimeout(comboTimer);comboTimer=setTimeout(()=>comboCount=0,1000);let damage=(type==='kick'?18:11)+(comboCount>=3?7:0);enemy.hp=Math.max(0,enemy.hp-damage);document.querySelector('#title').textContent=comboCount>=3?'COMBO STRIKE!':'STREET LEGEND · DEMO';enemy.attack=-1;flash=3;setTimeout(()=>enemy.attack=0,180)}player.attack=type==='kick'?2:1;setTimeout(()=>player.attack=0,200);hud()};
update=function(){let sp=.005;for(let k in keys)if(keys[k]){if(k==='up')player.y-=sp;if(k==='down')player.y+=sp;if(k==='left')player.x-=sp;if(k==='right')player.x+=sp}player.x=Math.max(.08,Math.min(.92,player.x));player.y=Math.max(.45,Math.min(.85,player.y));if(enemy.hp>0&&player.hp>0){let dx=player.x-enemy.x,dy=player.y-enemy.y;enemy.x+=Math.sign(dx)*.0013;enemy.y+=Math.sign(dy)*.0007;if(Math.abs(dx)<.11&&Math.abs(dy)<.13&&Math.random()<.009&&!dodging){player.hp=Math.max(0,player.hp-(blocking?1:4));flash=blocking?1:4;hud()}}hud();setTimeout(update,30)};update();
</script>
<!-- Gameplay upgrade: keyboard, smarter movement, cooldowns and effects -->
<script>
// Keyboard play and improved combat presentation
const keyMap={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};
addEventListener('keydown',e=>{if(keyMap[e.key]){keys[keyMap[e.key]]=true;e.preventDefault()} if(e.key==='j')hit('punch');if(e.key==='k')hit('kick');if(e.key==='l')blocking=true;if(e.key===' '){e.preventDefault();dodgeBtn.click()}});
addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false;if(e.key==='l')blocking=false});
// Smooth pulse effect when combat is close, with an optional shake on impact
let impactShake=0;
const oldDraw=fighter;
fighter=function(x,y,color,attack){oldDraw(x,y,color,attack);if(attack){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x*innerWidth,y*innerHeight-30,48,0,Math.PI*2);ctx.fill();ctx.restore()}};
// Prevent attacks from being spammed and make enemy strikes telegraphed
let playerCooldown=0,enemyWindup=0,enemyCooldown=0;
const previousHit=hit;
hit=function(type){if(playerCooldown>0||blocking)return;playerCooldown=type==='kick'?520:300;previousHit(type);setTimeout(()=>playerCooldown=0,type==='kick'?520:300)};
// Stronger rival behaviour: occasional wind-up attack, recover window and distance-aware pursuit.
update=function(){let sp=.0048;for(let k in keys)if(keys[k]){if(k==='up')player.y-=sp;if(k==='down')player.y+=sp;if(k==='left')player.x-=sp;if(k==='right')player.x+=sp}player.x=Math.max(.08,Math.min(.92,player.x));player.y=Math.max(.46,Math.min(.84,player.y));if(enemy.hp>0&&player.hp>0){let dx=player.x-enemy.x,dy=player.y-enemy.y,dist=Math.abs(dx);if(enemyWindup>0){enemyWindup-=30;if(enemyWindup<=0&&dist<.13&&Math.abs(dy)<.13&&!dodging){player.hp=Math.max(0,player.hp-(blocking?2:9));flash=blocking?2:5;hud();enemyCooldown=850}}else if(enemyCooldown>0)enemyCooldown-=30;else if(dist<.13&&Math.abs(dy)<.13&&Math.random()<.025){enemyWindup=240;document.querySelector('#title').textContent='RIVAL ATTACK! BLOCK OR DODGE';enemy.attack=1;setTimeout(()=>enemy.attack=0,220)}else{enemy.x+=Math.sign(dx)*.0012;enemy.y+=Math.sign(dy)*.00065}}hud();setTimeout(update,30)};
update();
</script>

<script>
// Additional polish: match-style timer, arena boundaries, stamina, round reset and mobile sound toggle.
let stamina=100, roundSeconds=90, roundTimer=null, soundEnabled=false;
const extraHud=document.createElement('div');extraHud.style.cssText='position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#101719cc;border:1px solid #87938a;border-radius:12px;padding:8px 14px;text-align:center;color:#fff;font-weight:800;z-index:5';extraHud.innerHTML='ROUND 1 · <span id="timer">90</span><br><small>STAMINA</small><div style="width:150px;height:8px;background:#555;border-radius:6px;overflow:hidden"><div id="staminabar" style="height:100%;width:100%;background:#53c8a1"></div></div>';document.body.appendChild(extraHud);
const soundBtn=document.createElement('button');soundBtn.textContent='🔇';soundBtn.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:8;background:#17201e;color:white;border:1px solid #aaa;border-radius:10px;padding:8px';document.body.appendChild(soundBtn);soundBtn.onclick=()=>{soundEnabled=!soundEnabled;soundBtn.textContent=soundEnabled?'🔊':'🔇'};
function startRoundClock(){if(roundTimer)clearInterval(roundTimer);roundSeconds=90;roundTimer=setInterval(()=>{if(player.hp<=0||enemy.hp<=0){clearInterval(roundTimer);return}roundSeconds--;document.querySelector('#timer').textContent=roundSeconds;if(roundSeconds<=0){clearInterval(roundTimer);document.querySelector('#title').textContent=player.hp>enemy.hp?'TIME UP · PLAYER WINS':'TIME UP · RIVAL WINS'}},1000)}startRoundClock();
// Stamina drains on attacks/dodge and regenerates while idle.
const oldHit=hit;hit=function(type){if(stamina<(type==='kick'?25:12)) {document.querySelector('#title').textContent='LOW STAMINA · RECOVER';return}stamina=Math.max(0,stamina-(type==='kick'?25:12));oldHit(type)};
const oldDodge=dodgeBtn.onclick;dodgeBtn.onclick=()=>{if(stamina<20){document.querySelector('#title').textContent='LOW STAMINA · RECOVER';return}stamina-=20;if(oldDodge)oldDodge()};
const staminaLoop=setInterval(()=>{if(!blocking&&!keys.up&&!keys.down&&!keys.left&&!keys.right)stamina=Math.min(100,stamina+1.2);document.querySelector('#staminabar').style.width=stamina+'%'},120);
// Keep both fighters within arena and add a small arena label.
const arenaLabel=document.createElement('div');arenaLabel.textContent='DOJO DISTRICT · NIGHT';arenaLabel.style.cssText='position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#cbd5d1;font-size:10px;letter-spacing:2px';document.body.appendChild(arenaLabel);
</script>

<script>
// Street Legend progression layer: escalating opponents, score and a mission HUD.
(()=>{
 let stage=1, kos=0, score=0, stageLock=false;
 const progress=document.createElement('div');progress.style.cssText='position:fixed;top:166px;left:50%;transform:translateX(-50%);z-index:7;background:#101719d9;border:1px solid #8a9995;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;text-align:center';progress.textContent='MISSION 1 · KOs 0 · SCORE 0';document.body.appendChild(progress);
 const originalHud=window.hud;
 const observer=new MutationObserver(()=>{if(enemy.hp<=0&&!stageLock&&player.hp>0){stageLock=true;kos++;score+=100*stage;progress.textContent='MISSION '+stage+' · KOs '+kos+' · SCORE '+score;document.querySelector('#title').textContent='KO! · '+(stage<5?'NEXT CHALLENGER':'STREET CHAMPION');if(stage<5)setTimeout(()=>{stage++;enemy.hp=100+stage*8;enemy.x=player.x<.5?.78:.22;enemy.y=.58;player.hp=Math.min(100,player.hp+15);stamina=Math.min(100,stamina+30);stageLock=false;progress.textContent='MISSION '+stage+' · KOs '+kos+' · SCORE '+score;document.querySelector('#title').textContent='MISSION '+stage+' · FIGHT!';hud()},1400);else document.querySelector('#title').textContent='STREET CHAMPION · SCORE '+score;}});
 observer.observe(document.body,{subtree:true,childList:true,attributes:true});
})();
</script>

<script>
// Ability system: focus gauge, signature special and character style selection.
(()=>{
 let focus=100, specialBusy=false, style='BALANCED';
 const panel=document.createElement('div');panel.style.cssText='position:fixed;top:215px;left:50%;transform:translateX(-50%);z-index:9;background:#121c20e8;border:1px solid #86a0a0;border-radius:12px;padding:9px;color:#fff;font-size:11px;text-align:center';
 panel.innerHTML='<b>FIGHT STYLE</b><br><button id="stylebtn" style="margin:6px;padding:6px;background:#355568;color:white;border-radius:8px;border:1px solid #aaa">BALANCED</button><br><small>SPECIAL FOCUS</small><div style="width:145px;height:8px;background:#444;border-radius:8px;margin:5px auto"><div id="focusbar" style="width:100%;height:100%;background:#bb71f2;border-radius:8px"></div></div><button id="special" style="background:#75469a;color:white;border:1px solid #ddd;border-radius:10px;padding:9px;font-weight:bold">SPECIAL (F)</button>';document.body.appendChild(panel);
 const styles=['BALANCED','POWER','SPEED'];document.querySelector('#stylebtn').onclick=()=>{style=styles[(styles.indexOf(style)+1)%styles.length];document.querySelector('#stylebtn').textContent=style;document.querySelector('#title').textContent='STYLE: '+style};
 const special=()=>{if(specialBusy||focus<40||enemy.hp<=0||player.hp<=0)return;specialBusy=true;focus-=40;let distance=Math.abs(player.x-enemy.x)+Math.abs(player.y-enemy.y);if(distance<.28){enemy.hp=Math.max(0,enemy.hp- (style==='POWER'?38:30));flash=9;player.attack=3;setTimeout(()=>player.attack=0,400);hud();document.querySelector('#title').textContent='SIGNATURE STRIKE!'}else document.querySelector('#title').textContent='SPECIAL MISSED · CLOSE THE GAP';setTimeout(()=>specialBusy=false,900)};
 document.querySelector('#special').onclick=special;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')special()});
 setInterval(()=>{focus=Math.min(100,focus+.35);document.querySelector('#focusbar').style.width=focus+'%'},100);
 const styleTip=document.createElement('div');styleTip.textContent='POWER: harder specials · SPEED: mobility · F = special';styleTip.style.cssText='position:fixed;bottom:158px;left:50%;transform:translateX(-50%);font-size:10px;color:#ddd;background:#111b;padding:6px 8px;border-radius:8px;white-space:nowrap';document.body.appendChild(styleTip);
})();
</script>

<script>
// Persistent fighter profile and roster selection.
(()=>{
 const fighters=[{name:'KAI',style:'BALANCED',bonus:'Steady combat'},{name:'BRUTUS',style:'POWER',bonus:'Heavy strike focus'},{name:'SHADE',style:'SPEED',bonus:'Agile fighter'}];let selected=0;
 let save={coins:0,unlocked:0,fighter:0};try{save=Object.assign(save,JSON.parse(localStorage.getItem('streetLegendSave')||'{}'))}catch(e){}
 selected=save.fighter||0;
 const roster=document.createElement('div');roster.style.cssText='position:fixed;top:255px;left:50%;transform:translateX(-50%);z-index:10;background:#111c20ed;border:1px solid #8aa0a0;border-radius:12px;padding:8px;color:#fff;font-size:11px;text-align:center';roster.innerHTML='<b>FIGHTER</b><br><button id="rosterprev">◀</button> <span id="fightername">'+fighters[selected].name+'</span> <button id="rosternext">▶</button><br><small id="fighterinfo">'+fighters[selected].bonus+'</small>';document.body.appendChild(roster);
 const profile=document.createElement('div');profile.style.cssText='position:fixed;top:8px;right:50%;transform:translateX(50%);margin-top:44px;z-index:8;background:#121c20db;border:1px solid #9b8b62;border-radius:9px;padding:5px 10px;color:#f6d58a;font-size:11px';profile.textContent='STREET COINS: '+save.coins;document.body.appendChild(profile);
 function choose(i){selected=(i+fighters.length)%fighters.length;document.querySelector('#fightername').textContent=fighters[selected].name;document.querySelector('#fighterinfo').textContent=fighters[selected].bonus;save.fighter=selected;localStorage.setItem('streetLegendSave',JSON.stringify(save));}
 document.querySelector('#rosterprev').onclick=()=>choose(selected-1);document.querySelector('#rosternext').onclick=()=>choose(selected+1);
 const origHud=window.hud;let awarded=false;const watch=setInterval(()=>{if(enemy.hp<=0&&!awarded){awarded=true;save.coins=(save.coins||0)+100;profile.textContent='STREET COINS: '+save.coins;localStorage.setItem('streetLegendSave',JSON.stringify(save));}if(player.hp<=0)awarded=false;if(enemy.hp>0)awarded=false;},250);
})();
</script>

<script>
// Visual combat upgrade: arena lighting, improved silhouettes, animated ambience.
(()=>{const canvas=document.querySelector('#c'),ctx2=canvas.getContext('2d');const fx=document.createElement('canvas');fx.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2';document.body.appendChild(fx);let fctx=fx.getContext('2d');function fit(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);let motes=Array.from({length:65},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.4,v:Math.random()*.35+.1,a:Math.random()*.5+.15}));function ambient(){fctx.clearRect(0,0,innerWidth,innerHeight);motes.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth}fctx.globalAlpha=p.a;fctx.fillStyle='#c8d9dc';fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,6.28);fctx.fill()});fctx.globalAlpha=1;requestAnimationFrame(ambient)}ambient();const old=window.fighter;window.fighter=function(x,y,color,attack){let px=x*innerWidth,py=y*innerHeight,s=70+(y-.5)*55;ctx2.save();ctx2.translate(px,py);ctx2.fillStyle='#0005';ctx2.beginPath();ctx2.ellipse(0,s*.63,s*.42,s*.12,0,0,6.28);ctx2.fill();ctx2.fillStyle=color;ctx2.fillRect(-s*.15,-s*.12,s*.3,s*.42);ctx2.fillStyle='#d4a078';ctx2.beginPath();ctx2.arc(0,-s*.3,s*.16,0,6.28);ctx2.fill();ctx2.fillStyle='#17191c';ctx2.fillRect(-s*.17,-s*.36,s*.34,s*.07);ctx2.strokeStyle=color;ctx2.lineWidth=s*.12;ctx2.lineCap='round';ctx2.beginPath();ctx2.moveTo(-s*.12,s*.02);ctx2.lineTo(-s*.32,s*.12);ctx2.lineTo(-s*.42,s*.02+attack*5);ctx2.moveTo(s*.12,s*.02);ctx2.lineTo(s*.28,s*.1);ctx2.lineTo(s*.38,s*.02-attack*5);ctx2.moveTo(-s*.06,s*.3);ctx2.lineTo(-s*.2,s*.48);ctx2.lineTo(-s*.25,s*.6);ctx2.moveTo(s*.06,s*.3);ctx2.lineTo(s*.19,s*.48);ctx2.lineTo(s*.23,s*.6);ctx2.stroke();ctx2.fillStyle='#c7c7c7';ctx2.beginPath();ctx2.arc(-s*.42,s*.02+attack*5,s*.09,0,6.28);ctx2.arc(s*.38,s*.02-attack*5,s*.09,0,6.28);ctx2.fill();ctx2.restore()}})();
</script>
