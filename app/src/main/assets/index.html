<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a3a"><title>WordQuest</title><style>
:root{--bg:#0b1025;--panel:#151e40;--panel2:#202b53;--cyan:#61e8ff;--purple:#a78bfa;--text:#f5f7ff;--muted:#aab5d4;--gold:#ffd66b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#25316a,transparent 45%),radial-gradient(ellipse at 100% 90%,#34215d,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:18px}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:1.35rem;letter-spacing:.5px}.logo span{color:var(--cyan)}.pill{background:#1b2750;border:1px solid #334576;border-radius:999px;padding:9px 13px;font-size:.9rem}.card{background:linear-gradient(145deg,#172246ed,#111936f5);border:1px solid #354571;border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 18px 55px #0004}.hero{text-align:center;padding:30px 22px}.hero h1{font-size:2.2rem;margin:0 0 8px}.hero p{color:var(--muted)}button{background:linear-gradient(110deg,#55dff7,#a78bfa);border:0;color:#10172e;font-weight:800;border-radius:14px;padding:12px 16px;font-size:1rem;cursor:pointer}button.secondary{background:#24345e;color:white;border:1px solid #40578b}button.flat{background:transparent;color:var(--cyan);border:1px solid #39537c}button:disabled{opacity:.4;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#202b50;border-radius:16px;padding:13px;text-align:center}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.25rem}.clue{font-size:1.35rem;text-align:center;padding:18px 12px}.answer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:54px}.slot{width:44px;height:46px;border:2px dashed #53648f;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.15rem}.slot.filled{border-style:solid;border-color:var(--cyan);background:#23345a}.letters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0}.letter{width:46px;height:48px;border-radius:12px;background:#27365e;color:white;border:1px solid #516798;font-weight:900;font-size:1.15rem}.letter.used{opacity:.22}.hidden{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.success{color:#86f4c1}.warn{color:var(--gold)}select{background:#24345e;color:white;border:1px solid #40578b;border-radius:12px;padding:10px}.footer{text-align:center;color:#8391b8;font-size:.78rem;padding:18px}.toast{text-align:center;min-height:28px;color:var(--gold);font-weight:700}.progress{height:8px;background:#27345b;border-radius:20px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}@media(max-width:500px){body{padding:12px}.card{padding:17px}.slot,.letter{width:39px;height:42px}.hero h1{font-size:1.8rem}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">✦ WORD<span>QUEST</span></div><div class="row"><span class="pill">🪙 <b id="coins">100</b></span><span class="pill" id="langBadge">EN</span></div></header>
<section id="home" class="card hero"><h1>Find the word.<br><span style="color:var(--cyan)">Unlock your mind.</span></h1><p>A word puzzle adventure in English and Kiswahili.</p><div class="stats"><div class="stat"><small>LEVEL</small><strong id="levelStat">1</strong></div><div class="stat"><small>STREAK</small><strong id="streakStat">0 🔥</strong></div><div class="stat"><small>WORDS</small><strong id="wordsStat">0</strong></div></div><div class="buttons"><button onclick="start(false)">▶ Play</button><button class="secondary" onclick="start(true)">🌟 Daily Challenge</button></div><div class="row" style="margin-top:20px;justify-content:center"><label>Language <select id="language" onchange="changeLang()"><option value="en">English</option><option value="sw">Kiswahili</option></select></label><label>Difficulty <select id="difficulty" onchange="changeDifficulty()"><option value="all">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label></div><div class="buttons"><button class="flat" onclick="resetGame()">Reset progress</button><button class="flat" onclick="toggleSound()" id="soundBtn">🔊 Sound ON</button></div></section>
<section id="game" class="card hidden"><div class="row"><button class="flat" onclick="goHome()">← Home</button><div class="pill" id="modeLabel">Level 1</div><div class="pill">🪙 <span id="gameCoins">100</span></div></div><div class="progress"><div id="progressBar" style="width:0%"></div></div><div class="clue" id="clue">Clue</div><div class="answer" id="answer"></div><div class="letters" id="letters"></div><div class="toast" id="toast"></div><div class="buttons"><button class="secondary" onclick="hint()">💡 Hint (15)</button><button class="secondary" onclick="clearAnswer()">↺ Clear</button><button onclick="check()">Check ✓</button></div><div class="footer" id="gameFooter">Earn coins by solving puzzles.</div></section><footer class="footer">WordQuest • Learn, think, play • Progress saved on this device</footer></div>
<script>
const EN=[['planet','A world orbiting a star','easy'],['river','A natural flowing body of water','easy'],['pencil','A tool used for writing or drawing','easy'],['garden','A place where plants are grown','easy'],['window','An opening in a wall with glass','easy'],['bridge','A structure built over a gap','easy'],['orange','A citrus fruit and a colour','easy'],['shadow','A dark shape cast by light','easy'],['puzzle','A problem made to test your thinking','easy'],['forest','A large area filled with trees','easy'],['journey','Travel from one place to another','medium'],['diamond','A precious stone known for its hardness','medium'],['library','A place where books are kept','medium'],['whisper','To speak very softly','medium'],['gravity','The force that pulls objects together','medium'],['compass','A device that points north','medium'],['horizon','The line where sky meets land or sea','medium'],['courage','The ability to face fear','medium'],['harvest','Gathering crops from the fields','medium'],['village','A small community or settlement','medium'],['curiosity','The desire to know or learn something','hard'],['strategy','A plan designed to achieve a goal','hard'],['velocity','Speed in a particular direction','hard'],['mystery','Something difficult to explain or understand','hard'],['rhythm','A repeated pattern of sounds or movement','hard'],['invention','A new device or process created','hard'],['patience','Ability to wait calmly','hard'],['solution','An answer to a problem','hard'],['language','A system of words used to communicate','hard'],['wisdom','Knowledge combined with good judgement','hard'],['island','Land surrounded by water','easy'],['bottle','A container for liquids','easy'],['market','A place where goods are bought and sold','easy'],['cloud','A mass of water droplets in the sky','easy'],['music','Sounds arranged in a pleasing way','easy'],['engine','A machine that produces power','medium'],['balance','A steady or equal state','medium'],['festival','A celebration or special event','medium'],['energy','Power used to do work','medium'],['treasure','Valuable things kept or hidden','hard']];
const SW=[['mwezi','Kitu kinachoonekana angani usiku','easy'],['mto','Maji yanayotiririka kuelekea baharini','easy'],['kalamu','Chombo cha kuandika','easy'],['bustani','Mahali pa kupanda maua au mimea','easy'],['dirisha','Sehemu ya ukuta yenye nafasi ya kuingiza mwanga','easy'],['daraja','Muundo unaovuka mto au bonde','easy'],['machungwa','Tunda lenye ladha ya uchachu na utamu','easy'],['kivuli','Giza linalotokana na kuzuia mwanga','easy'],['kitendawili','Swali la kufikirisha lenye jibu','easy'],['msitu','Eneo kubwa lenye miti mingi','easy'],['safari','Kusafiri kutoka sehemu moja hadi nyingine','medium'],['almasi','Jiwe la thamani lenye ugumu mkubwa','medium'],['maktaba','Mahali pa kuhifadhi na kusoma vitabu','medium'],['kunongona','Kuzungumza kwa sauti ya chini','medium'],['mvuto','Nguvu inayovuta vitu kuelekea kila mmoja','medium'],['dira','Chombo kinachoonyesha mwelekeo','medium'],['upeo','Mstari unaoonekana mbali ambapo ardhi na anga hukutana','medium'],['ujasiri','Uwezo wa kukabiliana na hofu','medium'],['mavuno','Mazao yanayokusanywa shambani','medium'],['kijiji','Makazi madogo ya watu','medium'],['udadisi','Hamu ya kujua au kujifunza','hard'],['mkakati','Mpango wa kufikia lengo','hard'],['kasi','Umbali unaosafiriwa kwa muda','easy'],['fumbo','Jambo lisiloeleweka kwa urahisi','medium'],['mdundo','Mpangilio unaojirudia wa sauti','medium'],['uvumbuzi','Kitu kipya kilichobuniwa','hard'],['subira','Uwezo wa kusubiri kwa utulivu','medium'],['suluhisho','Jibu au njia ya kutatua tatizo','medium'],['lugha','Njia ya watu kuwasiliana','easy'],['hekima','Maarifa na busara ya kufanya maamuzi','hard'],['kisiwa','Ardhi iliyozungukwa na maji','easy'],['chupa','Kifaa cha kuhifadhi kimiminika','easy'],['soko','Mahali pa kununua na kuuza bidhaa','easy'],['wingu','Mkusanyiko wa matone angani','easy'],['muziki','Sauti zilizopangwa kwa mpangilio','easy'],['injini','Mashine inayozalisha nguvu','medium'],['usawa','Hali ya kuwa sawa','medium'],['sherehe','Tukio la kusherehekea','easy'],['nguvu','Uwezo wa kufanya kazi','easy'],['hazina','Vitu vya thamani vilivyokusanywa','hard']];
let data={};try{data=JSON.parse(localStorage.getItem('wqsave')||'{}')}catch(e){data={}};data.coins??=100;data.level??=1;data.words??=0;data.streak??=0;data.lang??='en';data.sound??=true;data.daily??='';let daily=false,word='',clue='',pool=[],picked=[],hinted=0,levelNum=1;
function save(){try{localStorage.setItem('wqsave',JSON.stringify(data))}catch(e){toast('Progress storage unavailable')}updateStats()}function updateStats(){document.getElementById('coins').textContent=data.coins;document.getElementById('gameCoins').textContent=data.coins;document.getElementById('levelStat').textContent=data.level;document.getElementById('wordsStat').textContent=data.words;document.getElementById('streakStat').textContent=data.streak+' 🔥';document.getElementById('language').value=data.lang;document.getElementById('langBadge').textContent=data.lang.toUpperCase();document.getElementById('soundBtn').textContent=data.sound?'🔊 Sound ON':'🔇 Sound OFF'}function bank(){return data.lang==='en'?EN:SW}function changeLang(){data.lang=document.getElementById('language').value;save()}function changeDifficulty(){save()}function goHome(){document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden');save()}function start(isDaily){daily=isDaily;let list=bank().filter(x=>document.getElementById('difficulty').value==='all'||x[2]===document.getElementById('difficulty').value);if(isDaily){let dayIndex=Math.floor((Date.now()/86400000));list=[bank()[dayIndex%bank().length]];levelNum='Daily'}else{list=list.length?list:bank();let idx=(data.level-1)%list.length;list=[list[idx]];levelNum=data.level}word=list[0][0].toUpperCase();clue=list[0][1];picked=Array(word.length).fill(null);hinted=0;pool=word.split('').map((l,i)=>({l,i}));pool.sort(()=>Math.random()-.5);document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('modeLabel').textContent=isDaily?'🌟 Daily Challenge':'Level '+levelNum;document.getElementById('clue').textContent=clue;document.getElementById('progressBar').style.width=isDaily?'100%':Math.min(100,(data.level%10)*10)+'%';document.getElementById('toast').textContent='';render();updateStats()}function render(){let a=document.getElementById('answer');a.innerHTML='';for(let i=0;i<word.length;i++){let s=document.createElement('div');s.className='slot'+(picked[i]?' filled':'');s.textContent=picked[i]?.l||'';s.onclick=()=>remove(i);a.appendChild(s)}let l=document.getElementById('letters');l.innerHTML='';pool.forEach((x,i)=>{let b=document.createElement('button');b.className='letter'+(picked.some(p=>p?.i===x.i)?' used':'');b.textContent=x.l;b.disabled=picked.some(p=>p?.i===x.i);b.onclick=()=>choose(x);l.appendChild(b)});document.getElementById('gameCoins').textContent=data.coins}function choose(x){let i=picked.findIndex(p=>!p);if(i<0)return;picked[i]=x;render();tone(520)}function remove(i){if(picked[i]){picked[i]=null;render()}}function clearAnswer(){picked=[];render()}function check(){if(picked.filter(Boolean).length!==word.length){toast('Fill every letter first');return}let ans=picked.map(x=>x.l).join('');if(ans===word){toast('Correct! +20 coins ✨',true);data.coins+=20;data.words++;data.streak++;if(daily){let day=new Date().toISOString().slice(0,10);if(data.daily!==day){data.coins+=30;data.daily=day;toast('Daily solved! +20 coins and +30 daily bonus 🎉',true)}else toast('Daily puzzle solved!',true)}else data.level++;save();tone(760);setTimeout(()=>goHome(),900)}else{toast('Not quite. Try again!');tone(180)}}function hint(){if(data.coins<15){toast('Not enough coins for a hint');return}let i=picked.findIndex(p=>!p);if(i<0){toast('Answer already filled');return}let correct=pool.find(x=>x.i===i);if(!correct){let actual=word[i];correct={l:actual,i};}data.coins-=15;picked[i]=correct;hinted++;save();render();toast('Hint used: -15 coins');tone(440)}function toast(t,ok=false){let el=document.getElementById('toast');el.textContent=t;el.className='toast '+(ok?'success':'')}function resetGame(){if(confirm('Reset all WordQuest progress and coins?')){data={coins:100,level:1,words:0,streak:0,lang:data.lang,sound:data.sound,daily:''};save()}}function toggleSound(){data.sound=!data.sound;save()}function tone(freq){if(!data.sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}updateStats();
</script><style>
#extraPanel{margin-top:14px}.navgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.navtile{background:linear-gradient(145deg,#263967,#202448);border:1px solid #52689c;border-radius:18px;padding:14px;text-align:left;color:white;min-height:90px}.navtile b{display:block;font-size:1rem}.navtile small{color:#bfcae8}.modal{position:fixed;inset:0;background:#070b20ed;z-index:9;overflow:auto;padding:18px}.modalbox{max-width:700px;margin:20px auto;background:#172246;border:1px solid #52689c;border-radius:24px;padding:20px}.achievement{padding:12px;margin:8px 0;background:#25345d;border-radius:14px}.achievement.lock{opacity:.45}.barline{height:9px;border-radius:9px;background:#30416d;overflow:hidden}.barline span{display:block;height:100%;background:linear-gradient(90deg,#61e8ff,#a78bfa)}.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:15px;background:#26345d;margin:10px 0}.tag{color:#61e8ff;font-weight:bold}.badgepop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.08)}} 
</style>
<section id="extraPanel" class="card"><div class="row"><h3 style="margin:0">🧭 Your adventure</h3><span class="pill" id="xpBadge">0 XP</span></div><div class="barline" style="margin:12px 0"><span id="xpBar" style="width:0%"></span></div><div class="navgrid"><button class="navtile" onclick="openExtra('missions')">📋 <b>Missions</b><small>Daily goals and rewards</small></button><button class="navtile" onclick="openExtra('achievements')">🏆 <b>Achievements</b><small>Collect badges</small></button><button class="navtile" onclick="openExtra('shop')">🛍️ <b>Coin shop</b><small>Spend your coins</small></button><button class="navtile" onclick="openExtra('stats')">📊 <b>Statistics</b><small>Your word journey</small></button><button class="navtile" onclick="openExtra('modes')">🎮 <b>Game modes</b><small>Choose a challenge</small></button><button class="navtile" onclick="openExtra('wordbook')">📖 <b>Wordbook</b><small>Words you've solved</small></button></div></section>
<div id="extraModal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="modalTitle">WordQuest</h2><button class="secondary" onclick="closeExtra()">✕</button></div><div id="modalBody"></div></div></div><script>
// WordQuest expansion: progression, mission rewards, wordbook, modes and local stats
data.xp??=0;data.solved??=[];data.mode??='classic';data.missionsDate??='';data.missions??={};data.badges??=[];data.powerups??={};
function updateExtra(){document.getElementById('xpBadge').textContent=(data.xp||0)+' XP';document.getElementById('xpBar').style.width=((data.xp%100))+'%';}
const missionsList=[['Solve 3 puzzles',()=>data.words>=3,30],['Earn 100 coins',()=>data.coins>=100,25],['Use a hint',()=>data.powerups.hintsUsed>0,20],['Solve a hard word',()=>data.solved.some(x=>x.d==='hard'),40]];
function openExtra(which){let title='',html='';
if(which==='missions'){title='📋 Missions';html=missionsList.map((m,i)=>'<div class="achievement"><b>'+m[0]+'</b><p>'+(m[1]()?'✅ Completed':'🔒 Keep playing')+'</p><span class="tag">Reward: '+m[2]+' coins</span></div>').join('')+'<p class="muted">Mission progress is calculated from your game activity on this device.</p>'}
if(which==='achievements'){title='🏆 Achievements';let list=[['First steps',data.words>=1,'Solve your first puzzle'],['Word explorer',data.words>=10,'Solve 10 puzzles'],['Scholar',data.words>=50,'Solve 50 puzzles'],['Coin collector',data.coins>=500,'Hold 500 coins'],['Daily spark',!!data.daily,'Complete a daily challenge'],['Hint helper',(data.powerups.hintsUsed||0)>=5,'Use 5 hints']];html=list.map(x=>'<div class="achievement '+(x[1]?'':'lock')+'">'+(x[1]?'🏅':'🔒')+' <b>'+x[0]+'</b><p>'+x[2]+'</p></div>').join('')}
if(which==='shop'){title='🛍️ Coin shop';html='<p>Exchange coins for puzzle tools.</p>'+[['Reveal a letter',25,'letter'],['Shuffle letters',10,'shuffle'],['Extra hint',40,'hint']].map(x=>'<div class="shopitem"><span>'+x[0]+'</span><button onclick="buyTool(\''+x[2]+'\','+x[1]+')">'+x[1]+' 🪙</button></div>').join('')}
if(which==='stats'){title='📊 Statistics';html='<div class="stats"><div class="stat"><small>SOLVED</small><strong>'+data.words+'</strong></div><div class="stat"><small>LEVEL</small><strong>'+data.level+'</strong></div><div class="stat"><small>XP</small><strong>'+data.xp+'</strong></div><div class="stat"><small>STREAK</small><strong>'+data.streak+'</strong></div><div class="stat"><small>COINS</small><strong>'+data.coins+'</strong></div><div class="stat"><small>HINTS</small><strong>'+(data.powerups.hintsUsed||0)+'</strong></div></div><p>Your progress is saved locally on this device.</p>'}
if(which==='modes'){title='🎮 Game modes';html='<div class="achievement"><b>Classic</b><p>Relaxed progression puzzle.</p><button onclick="setMode(\'classic\')">Play Classic</button></div><div class="achievement"><b>Timed challenge</b><p>Race the 60-second clock. Solve as many words as possible.</p><button onclick="setMode(\'timed\')">Start timed mode</button></div><div class="achievement"><b>Daily puzzle</b><p>One special daily word with bonus coins.</p><button onclick="start(true);closeExtra()">Play daily</button></div><div class="achievement"><b>Survival</b><p>Three mistakes allowed. Each correct word advances you.</p><button onclick="setMode(\'survival\')">Start survival</button></div>'}
if(which==='wordbook'){title='📖 Wordbook';html=data.solved.length?data.solved.slice().reverse().map(x=>'<div class="achievement"><b>'+x.w+'</b><p>'+x.c+'</p><small>'+x.l.toUpperCase()+' • '+x.d+'</small></div>').join(''):'<p>Solved words will appear here, with their clues and language.'}
document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('extraModal').classList.remove('hidden');updateExtra()}
function closeExtra(){document.getElementById('extraModal').classList.add('hidden')}
function buyTool(type,cost){if(data.coins<cost){alert('Not enough coins');return}data.coins-=cost;data.powerups[type]=(data.powerups[type]||0)+1;save();alert('Purchased! Available: '+data.powerups[type]);}
function setMode(mode){data.mode=mode;closeExtra();start(false);if(mode==='timed'){data.timeLeft=60;timedTick()}if(mode==='survival'){data.mistakes=0;toast('Survival mode: 3 mistakes allowed!')}}
let timerHandle=null;function timedTick(){clearTimeout(timerHandle);if(data.timeLeft<=0){toast('Time is up!');goHome();return}document.getElementById('modeLabel').textContent='⏱ '+data.timeLeft+'s';data.timeLeft--;timerHandle=setTimeout(timedTick,1000)}
const oldCheck=check;check=function(){let before=data.words;oldCheck();if(data.words>before){data.xp+=25;let found={w:word,c:clue,l:data.lang,d:(bank().find(x=>x[0].toUpperCase()===word)?.[2]||'unknown')};data.solved.push(found);if(data.solved.length>500)data.solved.shift();save();updateExtra();if(data.mode==='timed'&&data.timeLeft>0)data.timeLeft=Math.min(60,data.timeLeft+5)}else if(data.mode==='survival'&&picked.every(Boolean)){data.mistakes=(data.mistakes||0)+1;if(data.mistakes>=3){toast('Survival over!');goHome()}}};
const oldHint=hint;hint=function(){oldHint();data.powerups.hintsUsed=(data.powerups.hintsUsed||0)+1;save()};
const oldUpdate=updateStats;updateStats=function(){oldUpdate();updateExtra()};
updateExtra();
</script></body></html>
