name: Street Legend project checks

on:
  push:
    paths:
      - "fighting-tiger-prototype/StreetLegendUnity/**"
      - ".github/workflows/street-legend-validation.yml"
  pull_request:
    paths:
      - "fighting-tiger-prototype/StreetLegendUnity/**"
      - ".github/workflows/street-legend-validation.yml"
  workflow_dispatch:

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Unity project structure
        run: python fighting-tiger-prototype/StreetLegendUnity/Tools/validate_project.py
