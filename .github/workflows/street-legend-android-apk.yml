name: Build Street Legend Android APK

on:
  workflow_dispatch:
  push:
    branches: [godot-migration]
    paths:
      - "StreetLegendGodot/**"
      - ".github/workflows/street-legend-android-apk.yml"

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Godot 4.3 and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Import and validate Godot project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          godot --headless --editor --path StreetLegendGodot --quit
          godot --headless --path StreetLegendGodot --quit-after 5

      - name: Install Android build template
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: godot --headless --editor --path StreetLegendGodot --install-android-build-template --quit

      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p StreetLegendGodot/build
          godot --headless --path StreetLegendGodot --export-debug "Android" StreetLegendGodot/build/StreetLegend-debug.apk
          test -s StreetLegendGodot/build/StreetLegend-debug.apk
          file StreetLegendGodot/build/StreetLegend-debug.apk
          ls -lh StreetLegendGodot/build/StreetLegend-debug.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetLegend-Android-debug
          path: StreetLegendGodot/build/StreetLegend-debug.apk
          if-no-files-found: error
          retention-days: 30
