name: Build Street Legend Android APK

on:
  workflow_dispatch:
  push:
    branches: [godot-migration]
    paths:
      - "StreetLegendGodot/**"
      - ".github/workflows/street-legend-android-apk.yml"

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L --fail --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-tools.zip"
          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android build packages
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --sdk_root="$HOME/android-sdk" --licenses
          set -o pipefail
          sdkmanager --sdk_root="$HOME/android-sdk" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "Installed SDK packages:"
          sdkmanager --sdk_root="$HOME/android-sdk" --list_installed
          echo "SDK directory tree:"
          find "$HOME/android-sdk" -maxdepth 3 -type d | sort | head -100
          test -x "$HOME/android-sdk/platform-tools/adb"
          test -x "$HOME/android-sdk/build-tools/34.0.0/apksigner"
          test -d "$HOME/android-sdk/cmake/3.10.2.4988404"
          test -d "$HOME/android-sdk/ndk/23.2.8568313"

      - name: Install Godot 4.3 and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configure Android SDK paths and debug signing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Godot project
        run: |
          godot --headless --editor --path StreetLegendGodot --quit
          godot --headless --path StreetLegendGodot --quit-after 5

      - name: Install Android build template
        run: godot --headless --editor --path StreetLegendGodot --install-android-build-template --quit

      - name: Export debug APK
        run: |
          mkdir -p StreetLegendGodot/build
          set -o pipefail
          godot --headless --verbose --path StreetLegendGodot --export-debug "Android" StreetLegendGodot/build/StreetLegend-debug.apk 2>&1 | tee "$RUNNER_TEMP/godot-android-export.log"
          test -s StreetLegendGodot/build/StreetLegend-debug.apk
          file StreetLegendGodot/build/StreetLegend-debug.apk
          ls -lh StreetLegendGodot/build/StreetLegend-debug.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetLegend-Android-debug
          path: StreetLegendGodot/build/StreetLegend-debug.apk
          if-no-files-found: error
          retention-days: 30
